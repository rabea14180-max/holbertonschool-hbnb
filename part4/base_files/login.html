<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | HBnB</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <a href="index.html" class="logo-container">
        <img src="images/logo.svg" alt="HBnB Logo" class="logo-image">
        <div class="brand-name">HBnB</div>
    </a>
    <nav>
        <a href="index.html">Home</a>
        <div class="theme-switch-wrapper">
            <label class="theme-switch" for="checkbox">
                <input type="checkbox" id="checkbox" />
                <div class="slider round"></div>
            </label>
        </div>
    </nav>
</header>

<main>
    <div class="form-card">
        <h2 class="form-title">Welcome Back</h2>
        
        <form id="login-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="john@example.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn">Login</button>
            </div>
            
            <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
                Don't have an account? <a href="register.html" style="color: var(--primary-color); font-weight: 500;">Register here</a>
            </p>
        </form>
    </div>
</main>

<footer>
    <p>&copy; 2026 HBnB. All rights reserved.</p>
</footer>

<script src="scripts.js"></script>
</body>
</html>
