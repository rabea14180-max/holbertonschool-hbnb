<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBnB - Add New Amenity</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .add-place-container { /* Reusing container style */
            max-width: 600px;
            margin: 0 auto;
        }
        .form-row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .form-row .form-group {
            flex: 1;
            min-width: 250px;
        }
    </style>
</head>
<body>

<header style="display: flex; justify-content: space-between; align-items: center; padding: 1rem 5%; border-bottom: 1px solid var(--border-color); background: var(--surface-color); position: sticky; top: 0; z-index: 100;">
    <a href="index.html" class="logo-container" style="flex: 1; display: flex; align-items: center; gap: 8px; text-decoration: none;">
        <img src="images/logo.svg" alt="HBnB Logo" class="logo-image" style="height: 32px;" onerror="this.style.display='none'">
        <div class="brand-name" style="color: var(--primary-color); font-size: 1.3rem; font-weight: 700; letter-spacing: -0.5px;">HBnB</div>
    </a>
    
    <div style="flex: 2; display: flex; justify-content: center;">
        <div style="font-weight: 600; font-size: 1.1rem; color: var(--text-primary);">Host Dashboard</div>
    </div>
    
    <nav style="flex: 1; display: flex; justify-content: flex-end; align-items: center; gap: 15px; position: relative;">
        <a href="index.html" style="text-decoration: none; font-weight: 600; color: var(--text-primary); margin-right: 10px;">Switch to traveling</a>
        <div class="user-nav-pill" style="display: flex; align-items: center; gap: 12px; border: 1px solid var(--border-color); border-radius: 30px; padding: 5px 5px 5px 12px; cursor: pointer; transition: box-shadow 0.2s; background: var(--surface-color);">
            <div style="font-size: 1.1rem; color: var(--text-secondary);">☰</div>
            <div style="background: #e2e8f0; color: #64748b; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; overflow: hidden;">
                👤
            </div>
        </div>
    </nav>
</header>

<main class="add-place-container">
    <div class="form-card" style="max-width: 100%; margin-top: 2rem;">
        <h2 class="form-title">Add a New Amenity</h2>
        <p style="text-align: center; color: var(--text-secondary); margin-bottom: 2rem;">As an admin, you can define new amenities that hosts can select.</p>
        
        <form id="add-amenity-form">
            <div class="form-group">
                <label for="amenity-name">Amenity Name</label>
                <input type="text" id="amenity-name" placeholder="e.g. Swimming Pool, High-Speed WiFi" required>
            </div>
            
            <div class="form-group">
                <label for="amenity-icon">Icon Image URL</label>
                <input type="url" id="amenity-icon" placeholder="https://example.com/icon.png" style="width: 100%; border-radius: var(--radius); border: 1px solid var(--border-color); padding: 0.75rem; background-color: var(--input-bg); color: var(--text-color); font-family: inherit; font-size: 1rem;">
            </div>

            <div class="form-group">
                <label for="amenity-description">Description (Optional)</label>
                <textarea id="amenity-description" rows="3" placeholder="Briefly describe this amenity..." style="width: 100%; border-radius: var(--radius); border: 1px solid var(--border-color); padding: 0.75rem; background-color: var(--input-bg); color: var(--text-color); font-family: inherit; font-size: 1rem; resize: vertical;"></textarea>
            </div>

            <div class="form-actions" style="margin-top: 1.5rem;">
                <button type="submit" class="btn" style="width: 100%;">Create Amenity</button>
            </div>
        </form>
    </div>
</main>

<script src="scripts.js"></script>
</body>
</html>
