<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | HBnB</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <a href="index.html" class="logo-container">
        <img src="images/logo.svg" alt="HBnB Logo" class="logo-image">
        <div class="brand-name">HBnB</div>
    </a>
    <nav>
        <a href="index.html">Home</a>
        <div class="theme-switch-wrapper">
            <label class="theme-switch" for="checkbox">
                <input type="checkbox" id="checkbox" />
                <div class="slider round"></div>
            </label>
        </div>
    </nav>
</header>

<main>
    <div class="form-card">
        <h2 class="form-title">Create an Account</h2>
        
        <div class="registration-tabs" style="display: flex; gap: 10px; margin-bottom: 20px;">
            <button id="tab-guest" class="btn" style="flex: 1;" onclick="switchForm('guest')">Guest</button>
            <button id="tab-admin" class="btn" style="flex: 1; background: transparent; color: var(--primary-color); border: 2px solid var(--primary-color);" onclick="switchForm('admin')">Admin</button>
        </div>

        <form id="register-guest-form">
            <h3 style="margin-bottom: 1rem; color: var(--text-color); text-align: center;">Guest Registration</h3>
            <div class="form-group">
                <label for="guest-first-name">First Name</label>
                <input type="text" id="guest-first-name" placeholder="John" required>
            </div>
            <div class="form-group">
                <label for="guest-last-name">Last Name</label>
                <input type="text" id="guest-last-name" placeholder="Doe" required>
            </div>
            <div class="form-group">
                <label for="guest-email">Email</label>
                <input type="email" id="guest-email" placeholder="john@example.com" required>
            </div>
            <div class="form-group">
                <label for="guest-password">Password</label>
                <input type="password" id="guest-password" placeholder="••••••••" required>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn">Register as Guest</button>
            </div>
        </form>

        <form id="register-admin-form" style="display: none;">
            <h3 style="margin-bottom: 1rem; color: var(--text-color); text-align: center;">Admin Registration</h3>
            <div class="form-group">
                <label for="admin-first-name">First Name</label>
                <input type="text" id="admin-first-name" placeholder="Admin" required>
            </div>
            <div class="form-group">
                <label for="admin-last-name">Last Name</label>
                <input type="text" id="admin-last-name" placeholder="User" required>
            </div>
            <div class="form-group">
                <label for="admin-email">Email</label>
                <input type="email" id="admin-email" placeholder="admin@example.com" required>
            </div>
            <div class="form-group">
                <label for="admin-password">Password</label>
                <input type="password" id="admin-password" placeholder="••••••••" required>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn" style="background-color: #8b5cf6;">Register as Admin</button>
            </div>
        </form>

        <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
            Already have an account? <a href="login.html" style="color: var(--primary-color); font-weight: 500;">Login here</a>
        </p>
    </div>
</main>

<footer>
    <p>&copy; 2026 HBnB. All rights reserved.</p>
</footer>

<script>
    function switchForm(type) {
        if(type === 'guest') {
            document.getElementById('register-guest-form').style.display = 'block';
            document.getElementById('register-admin-form').style.display = 'none';
            document.getElementById('tab-guest').style.background = 'var(--primary-color)';
            document.getElementById('tab-guest').style.color = '#ffffff';
            document.getElementById('tab-admin').style.background = 'transparent';
            document.getElementById('tab-admin').style.color = 'var(--primary-color)';
        } else {
            document.getElementById('register-guest-form').style.display = 'none';
            document.getElementById('register-admin-form').style.display = 'block';
            document.getElementById('tab-admin').style.background = 'var(--primary-color)';
            document.getElementById('tab-admin').style.color = '#ffffff';
            document.getElementById('tab-guest').style.background = 'transparent';
            document.getElementById('tab-guest').style.color = 'var(--primary-color)';
            document.getElementById('tab-guest').style.border = '2px solid var(--primary-color)';
        }
    }
</script>
<script src="scripts.js"></script>
</body>
</html>
