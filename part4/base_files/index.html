<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBnB | Discover Amazing Places</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header style="display: flex; justify-content: space-between; align-items: center; padding: 1rem 5%; border-bottom: 1px solid var(--border-color); background: var(--surface-color); position: sticky; top: 0; z-index: 100;">
    <a href="index.html" class="logo-container" style="flex: 1; display: flex; align-items: center; gap: 8px; text-decoration: none;">
        <img src="images/logo.svg" alt="HBnB Logo" class="logo-image" style="height: 32px;">
        <div class="brand-name" style="color: var(--primary-color); font-size: 1.3rem; font-weight: 700; letter-spacing: -0.5px;">HBnB</div>
    </a>
    
    <div class="header-search-pill" style="display: flex; align-items: center; background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 40px; padding: 0.5rem; padding-left: 1.2rem; box-shadow: 0 1px 2px rgba(0,0,0,0.08), 0 4px 12px rgba(0,0,0,0.05); flex: 2; max-width: 400px; transition: box-shadow 0.2s;">
        <input type="text" id="search-filter" placeholder="Anywhere • Any week • Add guests" style="border: none; outline: none; background: transparent; flex: 1; color: var(--text-primary); font-size: 0.95rem; font-weight: 500; width: 100%;">
        <div style="background: var(--primary-color); color: white; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; flex-shrink: 0; cursor: pointer; margin-left: 8px;">
            🔍
        </div>
    </div>
    
    <nav style="flex: 1; display: flex; justify-content: flex-end; align-items: center; gap: 15px;">
        <a href="index.html" style="text-decoration: none; font-weight: 600; color: var(--text-primary); margin-right: 10px;">Home</a>
        <div id="nav-actions-container" style="display: flex; gap: 10px; align-items: center;">
            <a href="login.html" class="btn login-button" id="login-link" style="padding: 0.5rem 1.2rem; border-radius: 20px; font-size: 0.9rem; border: none; box-shadow: none;">Log in</a>
        </div>
        <div class="user-nav-pill" style="display: flex; align-items: center; gap: 12px; border: 1px solid var(--border-color); border-radius: 30px; padding: 5px 5px 5px 12px; cursor: pointer; transition: box-shadow 0.2s;">
            <div style="font-size: 1.1rem; color: var(--text-secondary);">☰</div>
            <div style="background: #e2e8f0; color: #64748b; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; overflow: hidden;">
                👤
            </div>
        </div>
    </nav>
</header>

<main style="padding-top: 1rem;">
    <!-- Minimalist Category / Price Filter Row -->
    <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 2rem; padding: 0 5%; overflow-x: auto;">
        <div style="display: flex; align-items: center; gap: 10px; border: 1px solid var(--border-color); border-radius: 12px; padding: 0.5rem 1rem;">
            <span style="font-size: 0.9rem; color: var(--text-secondary);">Max Price:</span>
            <select id="price-filter" style="border: none; outline: none; background: transparent; color: var(--text-primary); font-weight: 500; font-size: 0.95rem; cursor: pointer;">
                <option value="All">Any</option>
                <option value="10">$10</option>
                <option value="50">$50</option>
                <option value="100">$100</option>
                <option value="200">$200</option>
                <option value="500">$500</option>
            </select>
        </div>
        
        <div class="theme-switch-wrapper" style="margin-left: auto;">
            <label class="theme-switch" for="checkbox">
                <input type="checkbox" id="checkbox" />
                <div class="slider round"></div>
            </label>
        </div>
    </div>

    <section id="places-list" style="padding: 0 5%;">
        <!-- Generated by scripts.js -->
    </section>
</main>

<footer>
    <p>&copy; 2026 HBnB. All rights reserved.</p>
</footer>

<script src="scripts.js"></script>
</body>
</html>
