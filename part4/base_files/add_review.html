<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Review | HBnB</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header style="display: flex; justify-content: space-between; align-items: center; padding: 1rem 5%; border-bottom: 1px solid var(--border-color); background: var(--surface-color); position: sticky; top: 0; z-index: 100;">
    <a href="index.html" class="logo-container" style="flex: 1; display: flex; align-items: center; gap: 8px; text-decoration: none;">
        <img src="images/logo.svg" alt="HBnB Logo" class="logo-image" style="height: 32px;">
        <div class="brand-name" style="color: var(--primary-color); font-size: 1.3rem; font-weight: 700; letter-spacing: -0.5px;">HBnB</div>
    </a>
    
    <div style="flex: 2;"></div>
    
    <nav style="flex: 1; display: flex; justify-content: flex-end; align-items: center; gap: 15px;">
        <a href="index.html" style="text-decoration: none; font-weight: 600; color: var(--text-primary); margin-right: 10px;">Home</a>
        <div class="theme-switch-wrapper" style="margin-right: 15px;">
            <label class="theme-switch" for="checkbox">
                <input type="checkbox" id="checkbox" />
                <div class="slider round"></div>
            </label>
        </div>
        <div id="nav-actions-container" style="display: flex; gap: 10px; align-items: center;">
            <a href="login.html" class="btn login-button" id="login-link" style="padding: 0.5rem 1.2rem; border-radius: 20px; font-size: 0.9rem; border: none; box-shadow: none;">Log in</a>
        </div>
        <div class="user-nav-pill" style="display: flex; align-items: center; gap: 12px; border: 1px solid var(--border-color); border-radius: 30px; padding: 5px 5px 5px 12px; cursor: pointer; transition: box-shadow 0.2s;">
            <div style="font-size: 1.1rem; color: var(--text-secondary);">☰</div>
            <div style="background: #e2e8f0; color: #64748b; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; overflow: hidden;">
                👤
            </div>
        </div>
    </nav>
</header>

<main>
    <div class="form-card admin-restricted">
        <h2 class="form-title">Tell Us Your Experience</h2>

        <form class="add-review form" id="review-form">
            <div class="form-group">
                <label for="rating">Rating</label>
                <select id="rating" required>
                    <option value="" disabled selected>Select rating out of 5</option>
                    <option value="1">1 - Poor</option>
                    <option value="2">2 - Fair</option>
                    <option value="3">3 - Good</option>
                    <option value="4">4 - Very Good</option>
                    <option value="5">5 - Excellent</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="review-text">Review</label>
                <textarea id="review-text" placeholder="I absolutely loved my stay..." rows="5" required></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn">Submit Review</button>
            </div>
            <div id="review-msg" style="margin-top: 15px; text-align: center; font-size: 0.95rem; font-weight: 500;"></div>
        </form>
    </div>
</main>

<footer>
    <p>&copy; 2026 HBnB. All rights reserved.</p>
</footer>

<script src="scripts.js"></script>
</body>
</html>
